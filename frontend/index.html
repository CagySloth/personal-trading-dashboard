<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Dashboard</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #nav { display: flex; gap: 0; background: #1e1e1e; padding: 0 12px; }
    #nav a {
      color: #aaa; text-decoration: none; padding: 8px 16px; font-size: 14px;
    }
    #nav a.active { color: #fff; border-bottom: 2px solid #2962FF; }
    #nav a:hover { color: #fff; }
    #toolbar {
      position: absolute;
      top: 42px;
      left: 10px;
      z-index: 10;
      display: flex;
      gap: 8px;
    }
    #ticker-select, #timeframe-select {
      font-size: 16px;
      padding: 4px 8px;
    }
    #data-notice {
      position: absolute;
      top: 76px;
      left: 10px;
      z-index: 10;
      font-size: 12px;
      color: #666;
      background: rgba(255,255,255,0.9);
      padding: 2px 8px;
      border-radius: 4px;
      display: none;
    }
    #settings-btn {
      position: absolute;
      top: 42px;
      right: 10px;
      z-index: 10;
      font-size: 14px;
      padding: 4px 12px;
      cursor: pointer;
    }
    #chart { width: 100vw; height: calc(100vh - 34px); }

    /* Settings panel */
    #settings-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
    }
    #settings-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      min-width: 300px;
    }
    #settings-panel h2 { margin-top: 0; }
    #settings-panel label {
      display: block;
      margin: 10px 0 4px;
      font-size: 13px;
      color: #555;
    }
    #settings-panel input[type="number"] {
      width: 80px;
      padding: 4px;
      font-size: 14px;
    }
    #settings-panel input[type="color"] {
      vertical-align: middle;
      width: 40px;
      height: 28px;
      border: 1px solid #ccc;
      padding: 0;
      cursor: pointer;
    }
    .settings-row { display: flex; align-items: center; gap: 8px; }
    #settings-panel hr { border: none; border-top: 1px solid #ddd; margin: 16px 0; }
    #settings-actions { margin-top: 18px; display: flex; gap: 8px; justify-content: flex-end; }
    #settings-actions button { padding: 6px 16px; font-size: 14px; cursor: pointer; }
    #settings-error { color: #d32f2f; font-size: 13px; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <nav id="nav">
    <a href="index.html" class="active">Chart</a>
    <a href="backtest.html">Backtest</a>
  </nav>
  <div id="toolbar">
    <select id="ticker-select"></select>
    <select id="timeframe-select">
      <option value="1d">1 Day</option>
      <option value="1h">1 Hour</option>
      <option value="5m">5 Min</option>
    </select>
  </div>
  <div id="data-notice"></div>
  <button id="settings-btn">Settings</button>

  <div id="settings-overlay">
    <div id="settings-panel">
      <h2>Indicator Settings</h2>

      <label>SMA Window</label>
      <div class="settings-row">
        <input type="number" id="set-sma-window" min="1">
        <label style="margin:0">Color</label>
        <input type="color" id="set-sma-color">
      </div>

      <hr>

      <label>RSI Window</label>
      <div class="settings-row">
        <input type="number" id="set-rsi-window" min="1">
        <label style="margin:0">Color</label>
        <input type="color" id="set-rsi-color">
      </div>

      <label>Overbought Threshold</label>
      <input type="number" id="set-rsi-overbought" min="1" max="99">

      <label>Oversold Threshold</label>
      <input type="number" id="set-rsi-oversold" min="1" max="99">

      <div id="settings-error"></div>
      <div id="settings-actions">
        <button id="settings-cancel">Cancel</button>
        <button id="settings-save">Save</button>
      </div>
    </div>
  </div>

  <div id="chart"></div>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    const API = 'http://127.0.0.1:8000';
    const select = document.getElementById('ticker-select');
    const tfSelect = document.getElementById('timeframe-select');
    const dataNotice = document.getElementById('data-notice');
    const settingsBtn = document.getElementById('settings-btn');
    const settingsOverlay = document.getElementById('settings-overlay');
    const settingsError = document.getElementById('settings-error');

    // Lightweight-charts accepts "YYYY-MM-DD" strings for daily data
    // but needs unix timestamps (seconds) for intraday data.
    function parseTime(datetimeStr) {
      if (datetimeStr.length === 10) return datetimeStr;
      return Math.floor(new Date(datetimeStr.replace(' ', 'T') + 'Z').getTime() / 1000);
    }

    const TF_LABELS = { '1d': '1-day', '1h': '1-hour', '5m': '5-minute' };
    const TF_RETENTION = { '1h': '~730 days', '5m': '~60 days' };

    const NAV_HEIGHT = 34;
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
      width: window.innerWidth,
      height: window.innerHeight - NAV_HEIGHT,
      layout: {
        panes: {
          separatorColor: '#9B9B9B',
        },
      },
    });

    // Price pane (pane 0): candlesticks + SMA
    const candlestickSeries = chart.addSeries(LightweightCharts.CandlestickSeries);
    const smaSeries = chart.addSeries(LightweightCharts.LineSeries, {
      color: '#2962FF',
      lineWidth: 2,
    });

    // RSI pane (pane 1)
    const rsiSeries = chart.addSeries(LightweightCharts.LineSeries, {
      color: '#E91E63',
      lineWidth: 2,
    }, 1);

    // RSI threshold lines — we'll recreate these when settings change.
    let rsiOverboughtLine = null;
    let rsiOversoldLine = null;

    function setThresholdLines(overbought, oversold) {
      if (rsiOverboughtLine) rsiSeries.removePriceLine(rsiOverboughtLine);
      if (rsiOversoldLine) rsiSeries.removePriceLine(rsiOversoldLine);
      rsiOverboughtLine = rsiSeries.createPriceLine({ price: overbought, color: '#787878', lineWidth: 1, lineStyle: 2, axisLabelVisible: false });
      rsiOversoldLine = rsiSeries.createPriceLine({ price: oversold, color: '#787878', lineWidth: 1, lineStyle: 2, axisLabelVisible: false });
    }

    const rsiPane = chart.panes()[1];
    rsiPane.setHeight(150);

    // MACD pane (pane 2): MACD line, signal line, histogram
    const macdLineSeries = chart.addSeries(LightweightCharts.LineSeries, {
      color: '#2962FF',
      lineWidth: 2,
    }, 2);
    const macdSignalSeries = chart.addSeries(LightweightCharts.LineSeries, {
      color: '#FF6D00',
      lineWidth: 1,
    }, 2);
    const macdHistSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
      color: '#26a69a',
    }, 2);

    const macdPane = chart.panes()[2];
    macdPane.setHeight(150);

    // Zero line for MACD pane.
    macdLineSeries.createPriceLine({ price: 0, color: '#787878', lineWidth: 1, lineStyle: 2, axisLabelVisible: false });

    // Signal markers plugin (v5 API: createSeriesMarkers instead of series.setMarkers).
    let signalMarkers = null;

    // --- Data loading ---

    function loadTicker(symbol) {
      const tf = tfSelect.value;
      dataNotice.style.display = 'none';
      fetch(`${API}/prices/${symbol}?timeframe=${tf}&sma=true&rsi=true&macd=true`)
        .then(r => r.json())
        .then(data => {
          if (!data.length) {
            candlestickSeries.setData([]);
            smaSeries.setData([]);
            rsiSeries.setData([]);
            macdLineSeries.setData([]);
            macdSignalSeries.setData([]);
            macdHistSeries.setData([]);
            if (signalMarkers) { signalMarkers.setMarkers([]); }
            const ret = TF_RETENTION[tf];
            if (ret) {
              dataNotice.textContent = `No ${TF_LABELS[tf]} data available for ${symbol}. Yahoo Finance retains ${TF_LABELS[tf]} data for only ${ret}.`;
            } else {
              dataNotice.textContent = `No data available for ${symbol}.`;
            }
            dataNotice.style.display = 'block';
            return;
          }
          candlestickSeries.setData(
            data.map(d => ({
              time: parseTime(d.datetime),
              open: d.open,
              high: d.high,
              low: d.low,
              close: d.close,
            }))
          );
          smaSeries.setData(
            data
              .filter(d => d.sma !== null)
              .map(d => ({ time: parseTime(d.datetime), value: d.sma }))
          );
          rsiSeries.setData(
            data
              .filter(d => d.rsi !== null)
              .map(d => ({ time: parseTime(d.datetime), value: d.rsi }))
          );
          macdLineSeries.setData(
            data
              .filter(d => d.macd !== null)
              .map(d => ({ time: parseTime(d.datetime), value: d.macd }))
          );
          macdSignalSeries.setData(
            data
              .filter(d => d.macd_signal !== null)
              .map(d => ({ time: parseTime(d.datetime), value: d.macd_signal }))
          );
          macdHistSeries.setData(
            data
              .filter(d => d.macd_hist !== null)
              .map(d => ({
                time: parseTime(d.datetime),
                value: d.macd_hist,
                color: d.macd_hist >= 0 ? '#26a69a' : '#ef5350',
              }))
          );

          // Show SMA-crossover signal markers only for SPY on daily timeframe.
          if (symbol === 'SPY' && tf === '1d') {
            loadSignals();
          } else {
            if (signalMarkers) { signalMarkers.setMarkers([]); }
          }

          chart.timeScale().fitContent();
        });
    }

    function loadSignals() {
      fetch(`${API}/signals/sma-crossover?ticker=SPY`)
        .then(r => r.json())
        .then(signals => {
          const markers = signals.map(s => ({
            time: s.date,
            position: s.type === 'buy' ? 'belowBar' : 'aboveBar',
            color: s.type === 'buy' ? '#2196F3' : '#e91e63',
            shape: s.type === 'buy' ? 'arrowUp' : 'arrowDown',
            text: s.type === 'buy' ? 'B' : 'S',
          }));
          if (signalMarkers) {
            signalMarkers.setMarkers(markers);
          } else {
            signalMarkers = LightweightCharts.createSeriesMarkers(candlestickSeries, markers);
          }
        });
    }

    // Apply visual settings (colors, thresholds) from a settings object.
    function applyVisualSettings(s) {
      smaSeries.applyOptions({ color: s.sma_color });
      rsiSeries.applyOptions({ color: s.rsi_color });
      setThresholdLines(s.rsi_overbought, s.rsi_oversold);
    }

    // --- Settings panel ---

    function openSettings() {
      settingsError.style.display = 'none';
      fetch(`${API}/settings`)
        .then(r => r.json())
        .then(s => {
          document.getElementById('set-sma-window').value = s.sma_window;
          document.getElementById('set-sma-color').value = s.sma_color;
          document.getElementById('set-rsi-window').value = s.rsi_window;
          document.getElementById('set-rsi-color').value = s.rsi_color;
          document.getElementById('set-rsi-overbought').value = s.rsi_overbought;
          document.getElementById('set-rsi-oversold').value = s.rsi_oversold;
          settingsOverlay.style.display = 'block';
        });
    }

    function closeSettings() {
      settingsOverlay.style.display = 'none';
    }

    function saveSettings() {
      settingsError.style.display = 'none';
      const body = {
        sma_window: parseInt(document.getElementById('set-sma-window').value),
        sma_color: document.getElementById('set-sma-color').value,
        rsi_window: parseInt(document.getElementById('set-rsi-window').value),
        rsi_color: document.getElementById('set-rsi-color').value,
        rsi_overbought: parseFloat(document.getElementById('set-rsi-overbought').value),
        rsi_oversold: parseFloat(document.getElementById('set-rsi-oversold').value),
      };

      fetch(`${API}/settings`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      })
        .then(r => {
          if (!r.ok) return r.json().then(err => { throw err; });
          return r.json();
        })
        .then(s => {
          closeSettings();
          applyVisualSettings(s);
          loadTicker(select.value);
        })
        .catch(err => {
          const msg = err.detail || JSON.stringify(err);
          settingsError.textContent = typeof msg === 'string' ? msg : msg.map(e => e.msg).join('; ');
          settingsError.style.display = 'block';
        });
    }

    settingsBtn.addEventListener('click', openSettings);
    document.getElementById('settings-cancel').addEventListener('click', closeSettings);
    document.getElementById('settings-save').addEventListener('click', saveSettings);

    // --- Init ---

    // Load settings first, apply visuals, then load tickers and data.
    fetch(`${API}/settings`)
      .then(r => r.json())
      .then(s => {
        applyVisualSettings(s);

        return fetch(`${API}/tickers`);
      })
      .then(r => r.json())
      .then(tickers => {
        tickers.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.symbol;
          opt.textContent = t.symbol;
          select.appendChild(opt);
        });
        select.value = 'SPY';
        loadTicker('SPY');
      });

    select.addEventListener('change', () => loadTicker(select.value));
    tfSelect.addEventListener('change', () => loadTicker(select.value));

    window.addEventListener('resize', () => {
      chart.resize(window.innerWidth, window.innerHeight - NAV_HEIGHT);
    });
  </script>
</body>
</html>
